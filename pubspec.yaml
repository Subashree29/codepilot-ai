name: codepilot_ai
description: "CodePilot AI - AI-powered programming learning assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

  # AI - Gemini
  google_generative_ai: ^0.4.6

  # State management
  provider: ^6.1.2

  # Local storage / offline
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5

  # UI
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.3
  flutter_markdown: ^0.7.4+3
  flutter_highlight: ^0.7.0
  google_fonts: ^6.2.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  equatable: ^2.0.5
  logger: ^2.4.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Generates all platform app-icon sizes from one master image.
# Run after `flutter pub get`:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#6750E8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"

# Generates the native (pre-Flutter-engine-boot) splash screen so there's
# no blank white flash before the in-app SplashScreen widget takes over.
# Run after `flutter pub get`:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#6750E8"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#6750E8"
    image: assets/splash/splash_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
